<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aichi Safety Radar | パトネットあいち情報マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-dark: #0a1128;
            --brand-primary: #1c2541;
            --brand-light: #f4f7f6;
            --accent-neon: #00b4d8;
            --accent-alert: #ff4d6d;
            --text-main: #1c2541;
            --text-muted: #758bfd;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; }
        body { background-color: var(--brand-light); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header {
            background: linear-gradient(135deg, #0a1128, #1c2541);
            color: white; padding: 18px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000;
        }

        .logo-area h1 {
            font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em;
            background: linear-gradient(45deg, #fff, var(--accent-neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 12px;
        }
        .logo-area p { font-size: 0.75rem; color: #8da9c4; margin-top: 2px; font-weight: 500; }
        .badge { background: rgba(0, 180, 216, 0.2); border: 1px solid var(--accent-neon); color: var(--accent-neon); padding: 6px 14px; border-radius: 30px; font-size: 0.8rem; font-weight: 600; }

        .container { display: flex; flex: 1; height: calc(100vh - 78px); position: relative; }
        #map { flex: 1; height: 100%; background: #e5e9f0; }

        .sidebar { width: 440px; background: #ffffff; display: flex; flex-direction: column; z-index: 999; border-left: 1px solid rgba(0,0,0,0.05); }
        .sidebar-header { padding: 30px; background: #ffffff; border-bottom: 1px solid #f0f0f0; }
        .sidebar-header h2 { font-size: 1.25rem; font-weight: 700; color: var(--brand-dark); margin-bottom: 15px; }
        
        .filter-select {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd;
            font-size: 0.85rem; font-weight: 500; color: var(--brand-primary); background-color: #fafbfc; outline: none; cursor: pointer;
        }

        .info-list { overflow-y: auto; flex: 1; padding: 20px; background: #fafbfc; }

        .info-card {
            background: #ffffff; border-radius: 16px; padding: 24px; margin-bottom: 16px;
            box-shadow: var(--card-shadow); border: 1px solid transparent; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden;
        }
        .info-card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--accent-alert); }
        .info-card:hover { transform: translateY(-4px); border-color: rgba(0, 180, 216, 0.3); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12); }

        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-date { font-size: 0.75rem; color: #a0aec0; font-weight: 600; }
        .card-tag { font-size: 0.7rem; background: #fff5f5; color: var(--accent-alert); padding: 2px 8px; border-radius: 4px; font-weight: 700; }
        .card-location { font-size: 1.05rem; font-weight: 700; color: var(--brand-dark); margin-bottom: 10px; line-height: 1.4; }
        .card-desc { font-size: 0.85rem; line-height: 1.6; color: #4a5568; }

        .custom-popup .leaflet-popup-content-wrapper { border-radius: 20px; padding: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); background: var(--brand-dark); color: white; }
        .custom-popup .leaflet-popup-tip { background: var(--brand-dark); }
        .popup-content h3 { font-size: 1.1rem; color: #ff758f; margin-bottom: 10px; font-weight: 700; }
        .popup-content p { font-size: 0.85rem; margin-bottom: 6px; color: #e2e8f0; line-height: 1.6; }

        @media (max-width: 900px) { .container { flex-direction: column-reverse; } .sidebar { width: 100%; height: 45%; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>AICHI SAFETY RADAR</h1>
            <p>パトネットあいち 全データ連動システム</p>
        </div>
        <div class="badge" id="updateStatus">データを読み込み中</div>
    </header>

    <div class="container">
        <div id="map"></div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h2>タイムライン</h2>
                <select id="monthFilter" class="filter-select" style="margin-top: 10px;">
                    <option value="all">すべての期間を表示</option>
                </select>
            </div>
            <div class="info-list" id="infoList"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([35.1814, 136.9063], 10);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'
        }).addTo(map);

        const infoList = document.getElementById('infoList');
        const monthFilter = document.getElementById('monthFilter');
        const updateStatus = document.getElementById('updateStatus');
        let incidents = [];
        let markersGroup = [];

        async function loadData() {
            try {
                const response = await fetch(`data/incidents.json?updated=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                incidents = await response.json();
                if (!Array.isArray(incidents)) throw new Error('データ形式が正しくありません');

                const months = [...new Set(incidents.map(item => item.archivePath))];
                monthFilter.replaceChildren(new Option('すべての期間を表示', 'all'));
                months.forEach(month => {
                    const [year, number] = month.split('/');
                    monthFilter.add(new Option(`${year}年${number}月`, month));
                });
                updateStatus.textContent = `最終更新: ${new Date().toLocaleString('ja-JP')}`;
                render();
            } catch (error) {
                updateStatus.textContent = 'データを読み込めません';
                infoList.textContent = `データを読み込めませんでした: ${error.message}`;
            }
        }

        function render() {
            markersGroup.forEach(m => map.removeLayer(m));
            markersGroup = [];
            infoList.innerHTML = "";

            const selectedMonth = document.getElementById('monthFilter').value;
            const filtered = incidents.filter(d => selectedMonth === 'all' || d.archivePath === selectedMonth);

            if(filtered.length === 0) {
                infoList.innerHTML = "<p style='padding:20px; color:#a0aec0; text-align:center;'>表示できるデータがありません。</p>";
                return;
            }

            filtered.forEach(data => {
                const marker = L.marker([data.lat, data.lng]).addTo(map);
                markersGroup.push(marker);
                
                marker.bindPopup(`
                    <div class="popup-content">
                        <h3>⚠️ ${data.tag}</h3>
                        <p><strong>🕒 日時:</strong> ${data.date}</p>
                        <p><strong>📍 場所:</strong> ${data.location}</p>
                        <p><strong>📄 詳細:</strong> ${data.description}</p>
                    </div>
                `, { className: 'custom-popup', minWidth: 280 });

                const card = document.createElement('div');
                card.className = 'info-card';
                card.innerHTML = `
                    <div class="card-meta">
                        <span class="card-date">${data.date}</span>
                        <span class="card-tag">${data.tag}</span>
                    </div>
                    <div class="card-location">${data.location}</div>
                    <div class="card-desc">${data.description}</div>
                `;
                
                card.addEventListener('click', () => {
                    map.setView([data.lat, data.lng], 13, { animate: true });
                    marker.openPopup();
                });
                infoList.appendChild(card);
            });
        }

        monthFilter.addEventListener('change', render);
        loadData();
    </script>
</body>
</html>
