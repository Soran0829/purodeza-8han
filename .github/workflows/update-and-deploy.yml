name: Update safety map and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - "scripts/**"
      - "index (1).html"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch past-year suspicious-person reports, geocode, and update CSV/JSON
        run: python scripts/update_data.py --months 12
      - name: Commit updated data ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/incidents.csv data/incidents.json
          if ! git diff --cached --quiet; then
            git commit -m "Update safety incident data"
            git push
          fi
      - name: Prepare site
        run: |
          mkdir -p site/data
          cp 'index (1).html' site/index.html
          cp data/incidents.csv site/data/incidents.csv
          cp data/incidents.json site/data/incidents.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
